# Alembic configuration for SMART Wi-Fi AutoPay.
#
# Run all Alembic commands from the "backend/" directory, for example:
#   python -m alembic upgrade head
#
# The database connection is NOT configured here. migrations/env.py
# builds it from the validated application settings (DB_* variables in
# the private .env file), so no password or connection string is ever
# stored in this file or in Git.

[alembic]
# Folder that holds env.py and the migration scripts.
script_location = migrations

# Make the "app" package importable when Alembic runs.
prepend_sys_path = .

# Migration file names: <revision id>_<slug>.py
# Revision ids are chosen by hand (0001, 0002, ...) so the order of the
# schema history is obvious.
file_template = %%(rev)s_%%(slug)s

# Where the version scripts live and how multiple paths are separated.
version_locations = %(here)s/migrations/versions
version_path_separator = os

# Intentionally empty. Set by migrations/env.py from application settings.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
